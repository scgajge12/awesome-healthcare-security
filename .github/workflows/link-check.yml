name: Link Check

# 参照先の移転や削除でリンクが切れていないかを、定期的に確認する。
on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]
  schedule:
    # 毎月 1 日に実行する
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,403,429
            --max-concurrency 8
            --exclude-path ./docs/_templates
            './**/*.md'
          fail: false

      # 政府機関や医療機関のサイトは自動アクセスを拒否することがあるため、
      # 検出結果は Issue として記録し、CI の失敗にはしない。
      - name: Create issue on failure
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "リンク切れの可能性を検出しました"
          content-filepath: ./lychee/out.md
          labels: bug, link-check
