<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="攻撃者から見た入口を示す図。外側に攻撃者を置き、境界に四つの入口を並べる。割合は警察庁が公表した令和 7 年のランサムウェア被害の侵入経路で、全業種を対象とした集計である。内訳は、VPN 機器が 61 件で 66 パーセント、リモートデスクトップが 19 件で 21 パーセント、不審メールと添付ファイルが 2 件で 2 パーセント、その他が 10 件である。有効回答は 92 件。VPN 機器とリモートデスクトップの合計が 87 パーセントを占める。入口を通ると、院内で権限が広がり、電子カルテと部門システムに到達し、診療が止まる。守る側は院内の台帳を内側から数え、攻撃者は外から到達できるかだけを数える。この差が、台帳にない資産として残る。">
  <title>攻撃者から見た入口と、その割合</title>
  <style>
    .outer  { fill: none; stroke: #8b949e; stroke-width: 1.5; }
    .zone   { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.5; }
    .inside { fill: #ddf4ff; stroke: #316dca; stroke-width: 1.5; }
    .attack { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .big    { fill: #fff8c5; stroke: #bf8700; stroke-width: 2; }
    .small  { fill: #ffffff; stroke: #8b949e; stroke-width: 1.5; }
    .item   { fill: #ffffff; stroke: #8b949e; stroke-width: 1; }
    .lead   { stroke: #8b949e; stroke-width: 1.5; fill: none; }
    .hot    { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .cold   { stroke: #8b949e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .t-title { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; font-weight: 700; }
    .t-head  { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13.5px; font-weight: 700; }
    .t       { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12.5px; }
    .t-sm    { fill: #656d76; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 11.5px; }
    .t-pct   { fill: #9a6700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 20px; font-weight: 700; }
    .t-pct-s { fill: #656d76; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; }
    .t-red   { fill: #cf222e; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .outer, .lead { stroke: #6e7681; }
      .zone   { fill: #161b22; stroke: #6e7681; }
      .inside { fill: #121d2f; stroke: #4184e4; }
      .attack { fill: #3c1618; stroke: #f85149; }
      .big    { fill: #341a00; stroke: #d29922; }
      .small, .item { fill: #0d1117; stroke: #6e7681; }
      .hot { stroke: #f85149; }
      .t-title, .t-head, .t { fill: #e6edf3; }
      .t-sm { fill: #9198a1; }
      .t-pct { fill: #d29922; }
      .t-pct-s { fill: #9198a1; }
      .t-red { fill: #f85149; }
    }
  </style>

  <rect class="outer" x="10" y="10" width="980" height="500" rx="8"/>
  <text class="t-title" x="500" y="38" text-anchor="middle">攻撃者は、院内の台帳ではなく、外から届く入口を数える</text>
  <text class="t-sm"    x="500" y="58" text-anchor="middle">割合は、警察庁が公表した令和 7 年のランサムウェア被害の侵入経路（全業種、有効回答 92 件）</text>

  <!-- 攻撃者 -->
  <rect class="attack" x="30" y="110" width="120" height="240" rx="6"/>
  <text class="t-head" x="90" y="212" text-anchor="middle">攻撃者</text>
  <text class="t-sm"   x="90" y="234" text-anchor="middle">外から機械的に</text>
  <text class="t-sm"   x="90" y="250" text-anchor="middle">入口を探す</text>

  <!-- 境界の帯 -->
  <text class="t-head" x="400" y="100" text-anchor="middle">境界（外から届く入口）</text>

  <rect class="big"   x="230" y="115" width="340" height="60" rx="5"/>
  <text class="t"     x="260" y="141">VPN 機器</text>
  <text class="t-sm"  x="260" y="160">保守用の遠隔接続を含む</text>
  <text class="t-pct" x="545" y="152" text-anchor="end">66%</text>

  <rect class="big"   x="230" y="185" width="340" height="60" rx="5"/>
  <text class="t"     x="260" y="211">リモートデスクトップ</text>
  <text class="t-sm"  x="260" y="230">院外から端末へ直接つなぐ経路</text>
  <text class="t-pct" x="545" y="222" text-anchor="end">21%</text>

  <rect class="small" x="230" y="255" width="340" height="45" rx="5"/>
  <text class="t"       x="260" y="283">不審メール、添付ファイル</text>
  <text class="t-pct-s" x="545" y="285" text-anchor="end">2%</text>

  <rect class="small" x="230" y="310" width="340" height="45" rx="5"/>
  <text class="t"       x="260" y="338">その他</text>
  <text class="t-pct-s" x="545" y="340" text-anchor="end">11%</text>

  <!-- 矢印 -->
  <path class="hot"  d="M150 145 L230 145" marker-end="url(#ah)"/>
  <path class="hot"  d="M150 215 L230 215" marker-end="url(#ah)"/>
  <path class="cold" d="M150 278 L230 278"/>
  <path class="cold" d="M150 333 L230 333"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="t-red" x="600" y="380" text-anchor="middle">上の二つで 87%</text>
  <text class="t-sm"  x="600" y="399" text-anchor="middle">いずれも装置の更新と認証の設定であり、予算と契約の決定に直結する</text>

  <!-- 内部 -->
  <rect class="inside" x="640" y="115" width="320" height="240" rx="6"/>
  <text class="t-head" x="800" y="142" text-anchor="middle">院内</text>
  <rect class="item" x="660" y="158" width="280" height="38" rx="4"/>
  <text class="t"    x="800" y="182" text-anchor="middle">権限が広がる（横展開）</text>
  <rect class="item" x="660" y="204" width="280" height="38" rx="4"/>
  <text class="t"    x="800" y="228" text-anchor="middle">バックアップが壊される</text>
  <rect class="item" x="660" y="250" width="280" height="38" rx="4"/>
  <text class="t"    x="800" y="274" text-anchor="middle">電子カルテ、部門システムへ到達</text>
  <rect class="item" x="660" y="296" width="280" height="38" rx="4"/>
  <text class="t"    x="800" y="320" text-anchor="middle">診療が止まる</text>

  <path class="lead" d="M570 145 L604 145 L604 235 L640 235" marker-end="url(#ag)"/>
  <path class="lead" d="M570 215 L604 215"/>

  <!-- 数え方の差 -->
  <rect class="zone" x="30" y="425" width="930" height="62" rx="6"/>
  <text class="t"    x="52" y="450">守る側の数え方</text>
  <text class="t-sm" x="52" y="470">院内の台帳を内側から数える。台帳にない資産は視野に入らない</text>
  <text class="t"    x="530" y="450">攻撃者の数え方</text>
  <text class="t-sm" x="530" y="470">外から到達できるかだけを数える。所管も台帳も関係しない</text>
  <path class="cold" d="M500 435 L500 480"/>
</svg>
