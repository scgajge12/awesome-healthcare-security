<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 775" role="img" aria-label="事業継続から見た三つの構え。オンプレミス（自院の設備に自院だけ）、クラウド（シングルテナント。一つの基盤に自院だけ）、クラウド（マルチテナント。一つの基盤に複数の医療機関）について、入口、診療業務、診療データ、アプリケーション、OS とミドルウェア、仮想化基盤、ハードウェア、施設と電源と回線の各層を、自組織で復旧に着手できる層、事業者の復旧を待つ層、他の利用者と同時に止まる層に塗り分けて比較する。オンプレミスは全層で自組織が着手でき、シングルテナントは仮想化基盤より下が事業者待ち、マルチテナントは診療データより下が全利用者と同時に止まる。下部に、同時に止まる相手、拠点が単一か複数か、止まる主な要因、侵入の実績がある経路、災害対策の費用、復旧の主導権、固有の全損モードを並べる。">
  <title>事業継続から見た三つの構え</title>
  <style>
    .outer { fill: none; stroke: #8b949e; stroke-width: 1.5; }
    .own   { fill: #ddf4ff; stroke: #316dca; stroke-width: 1.5; }
    .prov  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.5; }
    .warn  { fill: #fff8c5; stroke: #bf8700; stroke-width: 1.5; }
    .note  { fill: #ffffff; stroke: #8b949e; stroke-width: 1.5; }
    .head  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.5; }
    .t-title { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; font-weight: 700; }
    .t-head  { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 700; }
    .t       { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12.5px; }
    .t-sm    { fill: #656d76; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 11.5px; }
    .t-lab   { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .outer { stroke: #6e7681; }
      .own   { fill: #121d2f; stroke: #4184e4; }
      .prov  { fill: #161b22; stroke: #6e7681; }
      .warn  { fill: #341a00; stroke: #d29922; }
      .note  { fill: #0d1117; stroke: #6e7681; }
      .head  { fill: #161b22; stroke: #6e7681; }
      .t-title, .t-head, .t, .t-lab { fill: #e6edf3; }
      .t-sm { fill: #9198a1; }
    }
  </style>

  <rect class="outer" x="10" y="10" width="970" height="755" rx="8"/>
  <text class="t-title" x="495" y="38" text-anchor="middle">事業継続から見た三つの構え</text>

  <!-- 凡例 -->
  <rect class="own"  x="190" y="50" width="16" height="12" rx="2"/>
  <text class="t-sm" x="212" y="60">自組織で復旧に着手できる層</text>
  <rect class="prov" x="420" y="50" width="16" height="12" rx="2"/>
  <text class="t-sm" x="442" y="60">事業者の復旧を待つ層</text>
  <rect class="warn" x="630" y="50" width="16" height="12" rx="2"/>
  <text class="t-sm" x="652" y="60">他の利用者と同時に止まる層</text>

  <!-- 列見出し -->
  <rect class="head" x="205" y="72" width="240" height="44" rx="4"/>
  <text class="t-head" x="325" y="92" text-anchor="middle">オンプレミス</text>
  <text class="t-sm"  x="325" y="109" text-anchor="middle">自院の設備に、自院だけ</text>
  <rect class="head" x="465" y="72" width="240" height="44" rx="4"/>
  <text class="t-head" x="585" y="92" text-anchor="middle">クラウド（シングルテナント）</text>
  <text class="t-sm"  x="585" y="109" text-anchor="middle">一つの基盤に、自院だけ</text>
  <rect class="head" x="725" y="72" width="240" height="44" rx="4"/>
  <text class="t-head" x="845" y="92" text-anchor="middle">クラウド（マルチテナント）</text>
  <text class="t-sm"  x="845" y="109" text-anchor="middle">一つの基盤に、複数の医療機関</text>

  <!-- 層ラベル -->
  <text class="t-lab" x="30" y="147">入口（DNS、CDN、認証）</text>
  <text class="t-lab" x="30" y="189">診療業務</text>
  <text class="t-lab" x="30" y="231">診療データ</text>
  <text class="t-lab" x="30" y="273">アプリケーション</text>
  <text class="t-lab" x="30" y="315">OS、ミドルウェア</text>
  <text class="t-lab" x="30" y="357">仮想化基盤</text>
  <text class="t-lab" x="30" y="399">ハードウェア</text>
  <text class="t-lab" x="30" y="441">施設、電源、回線</text>

  <!-- オンプレミス列 -->
  <rect class="own" x="205" y="124" width="240" height="34" rx="4"/><text class="t" x="325" y="146" text-anchor="middle">院内で完結する処理は動く</text>
  <rect class="own" x="205" y="166" width="240" height="34" rx="4"/><text class="t" x="325" y="188" text-anchor="middle">自組織</text>
  <rect class="own" x="205" y="208" width="240" height="34" rx="4"/><text class="t" x="325" y="230" text-anchor="middle">手元にある</text>
  <rect class="own" x="205" y="250" width="240" height="34" rx="4"/><text class="t" x="325" y="272" text-anchor="middle">自組織（ベンダ保守）</text>
  <rect class="own" x="205" y="292" width="240" height="34" rx="4"/><text class="t" x="325" y="314" text-anchor="middle">自組織（ベンダ保守）</text>
  <rect class="own" x="205" y="334" width="240" height="34" rx="4"/><text class="t" x="325" y="356" text-anchor="middle">自組織（ベンダ保守）</text>
  <rect class="own" x="205" y="376" width="240" height="34" rx="4"/><text class="t" x="325" y="398" text-anchor="middle">代替機の調達が復旧を決める</text>
  <rect class="own" x="205" y="418" width="240" height="34" rx="4"/><text class="t" x="325" y="440" text-anchor="middle">自組織</text>

  <!-- シングルテナント列 -->
  <rect class="prov" x="465" y="124" width="240" height="34" rx="4"/><text class="t" x="585" y="146" text-anchor="middle">事業者の復旧を待つ</text>
  <rect class="own"  x="465" y="166" width="240" height="34" rx="4"/><text class="t" x="585" y="188" text-anchor="middle">自組織</text>
  <rect class="own"  x="465" y="208" width="240" height="34" rx="4"/><text class="t" x="585" y="230" text-anchor="middle">専用。複製を自組織で取れる</text>
  <rect class="own"  x="465" y="250" width="240" height="34" rx="4"/><text class="t" x="585" y="272" text-anchor="middle">専用。更新の時期を選べる</text>
  <rect class="own"  x="465" y="292" width="240" height="34" rx="4"/><text class="t" x="585" y="314" text-anchor="middle">専用。更新の時期を選べる</text>
  <rect class="warn" x="465" y="334" width="240" height="34" rx="4"/><text class="t" x="585" y="356" text-anchor="middle">事業者。障害は他社にも及ぶ</text>
  <rect class="warn" x="465" y="376" width="240" height="34" rx="4"/><text class="t" x="585" y="398" text-anchor="middle">事業者の復旧を待つ</text>
  <rect class="warn" x="465" y="418" width="240" height="34" rx="4"/><text class="t" x="585" y="440" text-anchor="middle">事業者の復旧を待つ</text>

  <!-- マルチテナント列 -->
  <rect class="warn" x="725" y="124" width="240" height="34" rx="4"/><text class="t" x="845" y="146" text-anchor="middle">全利用者で共通。同時に止まる</text>
  <rect class="own"  x="725" y="166" width="240" height="34" rx="4"/><text class="t" x="845" y="188" text-anchor="middle">自組織</text>
  <rect class="warn" x="725" y="208" width="240" height="34" rx="4"/><text class="t" x="845" y="230" text-anchor="middle">事業者が保持。取り出しは機能次第</text>
  <rect class="warn" x="725" y="250" width="240" height="34" rx="4"/><text class="t" x="845" y="272" text-anchor="middle">更新も障害も全利用者へ一斉</text>
  <rect class="warn" x="725" y="292" width="240" height="34" rx="4"/><text class="t" x="845" y="314" text-anchor="middle">事業者の復旧を待つ</text>
  <rect class="warn" x="725" y="334" width="240" height="34" rx="4"/><text class="t" x="845" y="356" text-anchor="middle">事業者の復旧を待つ</text>
  <rect class="warn" x="725" y="376" width="240" height="34" rx="4"/><text class="t" x="845" y="398" text-anchor="middle">事業者の復旧を待つ</text>
  <rect class="warn" x="725" y="418" width="240" height="34" rx="4"/><text class="t" x="845" y="440" text-anchor="middle">事業者の復旧を待つ</text>

  <!-- 下部の注記 -->
  <text class="t-lab" x="30" y="488">同時に止まる相手</text>
  <text class="t-lab" x="30" y="516">拠点は単一か複数か</text>
  <text class="t-lab" x="30" y="559">止まる主な要因</text>
  <text class="t-lab" x="30" y="602">侵入の実績がある経路</text>
  <text class="t-lab" x="30" y="645">災害対策の費用</text>
  <text class="t-lab" x="30" y="688">復旧の主導権</text>
  <text class="t-lab" x="30" y="716">固有の全損モード</text>

  <rect class="note" x="205" y="468" width="240" height="281" rx="4"/>
  <text class="t"    x="217" y="488">自院のみ</text>
  <text class="t-sm" x="217" y="516">自院の一か所が既定</text>
  <text class="t-sm" x="217" y="531">分けるなら別施設と回線が要る</text>
  <text class="t-sm" x="217" y="559">電源、空調、水害、機器故障</text>
  <text class="t-sm" x="217" y="574">保守期限切れ、ランサムウェア</text>
  <text class="t-sm" x="217" y="602">VPN 装置、公開サーバ、保守経路</text>
  <text class="t-sm" x="217" y="617">国内外で侵入の実績が多い</text>
  <text class="t-sm" x="217" y="645">高い。二拠点目の設備、回線、</text>
  <text class="t-sm" x="217" y="660">保守をすべて自前で用意する</text>
  <text class="t"    x="217" y="688">自組織。人員の上限で決まる</text>
  <text class="t-sm" x="217" y="716">仮想化基盤一台の暗号化で</text>
  <text class="t-sm" x="217" y="731">全システムが同時に止まる</text>

  <rect class="note" x="465" y="468" width="240" height="281" rx="4"/>
  <text class="t"    x="477" y="488">自院。基盤の障害では他社も</text>
  <text class="t-sm" x="477" y="516">単一 AZ、複数 AZ、複数地域</text>
  <text class="t-sm" x="477" y="531">から利用者が選び、記録できる</text>
  <text class="t-sm" x="477" y="559">事業者障害、設定の誤り</text>
  <text class="t-sm" x="477" y="574">資格情報の漏えい、管理面の侵害</text>
  <text class="t-sm" x="477" y="602">公開した機器と OS、権限設計</text>
  <text class="t-sm" x="477" y="617">守る面はオンプレミスと同じ</text>
  <text class="t-sm" x="477" y="645">高い。冗長構成の分だけ資源と</text>
  <text class="t-sm" x="477" y="660">運用の費用が増える</text>
  <text class="t"    x="477" y="688">専用部分は自組織、基盤は事業者</text>
  <text class="t-sm" x="477" y="716">アカウント単位の削除で、資源と</text>
  <text class="t-sm" x="477" y="731">複製が同時に消える</text>

  <rect class="note" x="725" y="468" width="240" height="281" rx="4"/>
  <text class="t"    x="737" y="488">契約した全医療機関が同時</text>
  <text class="t-sm" x="737" y="516">事業者が決め、利用者は選べない</text>
  <text class="t-sm" x="737" y="531">公表されないことも多い</text>
  <text class="t-sm" x="737" y="559">事業者障害、一斉更新の回帰</text>
  <text class="t-sm" x="737" y="574">事業者自身の侵害</text>
  <text class="t-sm" x="737" y="602">利用者側は認証情報と権限に</text>
  <text class="t-sm" x="737" y="617">集約される。基盤側は事業者</text>
  <text class="t-sm" x="737" y="645">安い。冗長は事業者の構成に</text>
  <text class="t-sm" x="737" y="660">含まれ、利用料に収まる</text>
  <text class="t"    x="737" y="688">事業者。順番も事業者が決める</text>
  <text class="t-sm" x="737" y="716">事業者の侵害、破綻、提供終了が</text>
  <text class="t-sm" x="737" y="731">全利用者に同時に及ぶ</text>
</svg>
