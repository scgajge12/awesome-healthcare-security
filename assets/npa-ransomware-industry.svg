<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="警察庁のランサムウェア被害報告件数の業種別内訳を令和3年から令和7年まで並べた表。製造業が一貫して首位で、医療・福祉は令和4年の20件で3位に入ったのを除き6位から7位で推移し、令和7年は上位に掲載されずその他に含まれている。">
