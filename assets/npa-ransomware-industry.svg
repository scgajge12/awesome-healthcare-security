  <text class="t-sm" x="24" y="480">日本標準産業分類の「医療，福祉」は、病院と診療所に加えて介護施設なども含む。医療機関だけの件数ではない。</text>
  <text class="t-sm" x="24" y="500">令和7年は上位6業種のみが公表されており、医療・福祉は「その他」24件の内側にある。最下位掲載の教育・学習支援が11件であることから、11件以下と読める。</text>
  <text class="t-sm" x="24" y="520">令和3年の運輸・郵便と医療・福祉はいずれも7件で同数である。順位は公表資料の記載順に従った。</text>
