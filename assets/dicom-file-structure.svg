<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="DICOM ファイルの構造。先頭 128 バイトのプリアンブルは規格上の未使用領域であり、マルウェアの埋め込みに悪用されうる。データセットには患者氏名や患者 ID などの識別情報が画像本体と同じファイルに格納される。">
  <title>DICOM ファイルの構造</title>
  <style>
    .box { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.5; }
    .box-warn { fill: #fff5f5; stroke: #e5534b; stroke-width: 2; }
    .box-pii { fill: #fff8e6; stroke: #d29922; stroke-width: 2; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; }
    .t-sm { fill: #656d76; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12px; }
    .t-mono { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .t-warn { fill: #cf222e; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 600; }
    .t-pii { fill: #9a6700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 600; }
    .lead { stroke: #8b949e; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .box-warn { fill: #2d1618; stroke: #f85149; }
      .box-pii { fill: #2b2213; stroke: #d29922; }
      .t { fill: #e6edf3; }
      .t-sm { fill: #9198a1; }
      .t-mono { fill: #e6edf3; }
      .t-warn { fill: #ff7b72; }
      .t-pii { fill: #e3b341; }
      .lead { stroke: #6e7681; }
    }
  </style>

  <rect class="box-warn" x="20" y="20" width="420" height="58" rx="4"/>
  <text class="t" x="36" y="45">プリアンブル（128 バイト）</text>
  <text class="t-sm" x="36" y="66">規格上の未使用領域。任意のバイト列を格納できる</text>
  <path class="lead" d="M 440 49 L 500 49"/>
  <text class="t-warn" x="508" y="44">実行ファイルのヘッダを置くと</text>
  <text class="t-warn" x="508" y="60">DICOM とマルウェアを兼ねる</text>

  <rect class="box" x="20" y="86" width="420" height="38" rx="4"/>
  <text class="t-mono" x="36" y="110">"DICM"（4 バイトのマジックナンバー）</text>

  <rect class="box" x="20" y="132" width="420" height="38" rx="4"/>
  <text class="t" x="36" y="156">メタ情報ヘッダ</text>

  <rect class="box-pii" x="20" y="178" width="420" height="132" rx="4"/>
  <text class="t" x="36" y="202">データセット（タグの集合）</text>
  <text class="t-mono" x="36" y="226">(0010,0010) PatientName</text>
  <text class="t-mono" x="36" y="246">(0010,0020) PatientID</text>
  <text class="t-mono" x="36" y="266">(0010,0030) PatientBirthDate</text>
  <text class="t-mono" x="36" y="286">(0008,0080) InstitutionName</text>
  <text class="t-mono" x="36" y="303">...</text>
  <path class="lead" d="M 440 240 L 500 240"/>
  <text class="t-pii" x="508" y="228">画像と同じファイルに</text>
  <text class="t-pii" x="508" y="244">患者識別情報が入っている</text>
  <text class="t-sm" x="508" y="264">匿名化せずに共有すると</text>
  <text class="t-sm" x="508" y="280">要配慮個人情報の漏えいになる</text>

  <rect class="box-pii" x="20" y="318" width="420" height="58" rx="4"/>
  <text class="t-mono" x="36" y="342">(7FE0,0010) PixelData</text>
  <text class="t-sm" x="36" y="363">画像本体</text>
  <path class="lead" d="M 440 347 L 500 347"/>
  <text class="t-pii" x="508" y="342">超音波画像などは、画像そのものに</text>
  <text class="t-pii" x="508" y="358">患者氏名が焼き込まれていることがある</text>
</svg>
